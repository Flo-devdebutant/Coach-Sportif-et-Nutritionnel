<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet · Coach sportif et nutritionnel</title>
<meta name="description" content="Programme d'entraînement personnalisé, menus sur mesure et suivi de progression. Fonctionne hors ligne.">
<meta name="theme-color" content="#090B0F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  /* Thème choisi appliqué avant le premier affichage, pour éviter un flash. */
  try { var t = JSON.parse(localStorage.getItem("carnet.theme")); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="splash" id="splash"><img src="assets/icons/icon-192.png" alt="" width="76" height="76"></div>

<div class="shell">
  <nav class="sidebar" aria-label="Navigation principale">
    <a class="sidebar__brand" href="#/today">
      <img src="assets/icons/icon-192.png" alt="" width="38" height="38">
      <span><b>Carnet</b><span>Sport &amp; nutrition</span></span>
    </a>
    <a class="side-link" href="#/today" data-nav="today"><svg class="icon" aria-hidden="true"><use href="#i-house"/></svg>Aujourd'hui</a>
    <a class="side-link" href="#/training" data-nav="training"><svg class="icon" aria-hidden="true"><use href="#i-dumbbell"/></svg>Entraînement</a>
    <a class="side-link" href="#/nutrition" data-nav="nutrition"><svg class="icon" aria-hidden="true"><use href="#i-utensils"/></svg>Nutrition</a>
    <a class="side-link" href="#/progress" data-nav="progress"><svg class="icon" aria-hidden="true"><use href="#i-chart-line"/></svg>Progrès</a>
    <a class="side-link" href="#/profile" data-nav="profile"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>Profil</a>
    <div class="sidebar__spacer"></div>
    <button type="button" class="btn btn-primary" data-action="quick-add"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Ajouter</button>
  </nav>
  <main class="main" id="main">
    <div id="view" class="view" aria-live="polite"></div>
  </main>
</div>

<div class="appbar" aria-hidden="true"><span class="appbar__title" id="appbarTitle"></span></div>

<nav class="dock" aria-label="Navigation">
  <a class="dock__item" href="#/today" data-nav="today"><svg class="icon" aria-hidden="true"><use href="#i-house"/></svg><span>Aujourd'hui</span></a>
  <a class="dock__item" href="#/training" data-nav="training"><svg class="icon" aria-hidden="true"><use href="#i-dumbbell"/></svg><span>Séances</span></a>
  <button type="button" class="dock__add" data-action="quick-add" aria-label="Ajouter un aliment, une activité ou une pesée"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
  <a class="dock__item" href="#/nutrition" data-nav="nutrition"><svg class="icon" aria-hidden="true"><use href="#i-utensils"/></svg><span>Nutrition</span></a>
  <a class="dock__item" href="#/progress" data-nav="progress"><svg class="icon" aria-hidden="true"><use href="#i-chart-line"/></svg><span>Progrès</span></a>
</nav>

<noscript><p style="padding:24px;font-family:system-ui">Carnet a besoin de JavaScript pour fonctionner.</p></noscript>
<script>
  /* Ouvert directement depuis le disque, le navigateur bloque les modules :
     on l'explique plutôt que de laisser l'écran de démarrage tourner. */
  if (location.protocol === "file:") {
    document.getElementById("splash").innerHTML = '<p style="max-width:340px;padding:24px;text-align:center;font:15px/1.5 system-ui;color:#A3ABBA">Ouvre Carnet depuis son adresse en ligne (par exemple sur GitHub Pages) : ouverte comme simple fichier, l\'application ne peut pas démarrer ni fonctionner hors ligne.</p>';
  }
</script>
</body>
</html>
